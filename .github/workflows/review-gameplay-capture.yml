name: Review gameplay capture
on:
  push:
    branches: [codex/workbench-capture-20261103]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm init -y > /dev/null
      - run: mkdir -p pages && cp -R index.html game.js game-core.js styles.css arcade pages/
      - run: npm install --no-save --ignore-scripts --package-lock=false playwright@1.63.0
      - run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: Capture genuine gameplay
        env:
          GAME_ID: kata-filipino-mahjongg-game-codex-openai-gpt-5.5-light
          SITE_ROOT: pages
        run: |
          export SOURCE_COMMIT="6b6c58ec9eea142738f5e0382d6d2e9e1e424bf1"
          python3 -m http.server 4320 --bind 127.0.0.1 --directory "$SITE_ROOT" > /tmp/capture-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for i in $(seq 1 40); do curl --fail --silent http://127.0.0.1:4320/ > /dev/null && break; sleep 0.25; done
          node scripts/capture-arcade.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: gameplay-capture
          path: capture-output/
          retention-days: 14
